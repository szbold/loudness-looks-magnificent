[package]
name = "loudness-looks-magnificent"
version = "0.1.0"
edition = "2024"
description = "Native OS-agnostic audio-reactive visualizer (spec: docs/PRODUCT.md)"
license = "Unlicense"

# Core stays dependency-light (CONVENTIONS.md); `clap` only lives here for the
# bootstrap binary layer, `thiserror` for typed errors.
[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# The real e2e suite lives outside `tests/` so `cargo test` recipes can gate it
# separately (CONVENTIONS.md testing rules).
[[test]]
name = "e2e"
path = "e2e/tests.rs"

[[test]]
name = "pipeline"
path = "tests/pipeline.rs"

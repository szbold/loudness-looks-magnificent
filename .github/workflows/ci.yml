# ci — the remote half of `just verify` (docs/CONVENTIONS.md).
# Required checks for `main` (AGENTS.md repo guardrails): quality, e2e, security.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml pin)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # llvm-cov executes the test suite itself; a separate `cargo test`
      # would trigger a third, mutually-invalidating rebuild of the wgpu
      # tree (review finding on the deps adoption PR).
      - name: coverage gate (NFR-7)
        run: cargo llvm-cov --workspace --all-targets --fail-under-lines 70

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml pin)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: e2e (headless, no audio device / no GPU needed — NFR-6)
        run: cargo test --test e2e

  # Software-GPU provisioning for adapter-level render tests (M1 plan T4).
  # Deliberately separate from e2e: the headless suite stays device-free
  # (NFR-6); this is the only job that requires a (software) device. The
  # probe runs before any build so a broken runner-side Vulkan wastes no
  # build minutes. Informational check until the offscreen-render task
  # (T5) hangs the adapter-level tests on it; promotion to a required
  # check is a repo-ruleset edit owned by the human.
  render-adapter:
    name: render-adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: install lavapipe (software Vulkan)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: probe ICD and device
        shell: bash
        run: |
          ls /usr/share/vulkan/icd.d/
          set -o pipefail
          vulkaninfo --summary 2>&1 | tee /tmp/vulkaninfo.txt
          grep -iq "llvmpipe" /tmp/vulkaninfo.txt

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
